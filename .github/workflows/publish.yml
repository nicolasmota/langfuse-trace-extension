name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        run: npx vsce package

      # VS Code Marketplace needs a PAT from the Microsoft account that owns
      # publisher "nicolasmota". If VSCE_PAT is missing/invalid, skip this step
      # so Open VSX (Cursor) still publishes.
      - name: Publish to VS Code Marketplace
        id: marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT not set; skipping Marketplace publish."
            exit 0
          fi
          npx vsce publish --pat "${VSCE_PAT}"

      - name: Publish to Open VSX (Cursor)
        run: npx ovsx publish *.vsix -p "${{ secrets.OVSX_PAT }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
